<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UC5 - Exercícios Módulo 1</title>
  </head>
  <body>
    <div id="app">
      <h1>UC5 - Exercícios Módulo 1</h1>

      <h2>Ping IPC (boilerplate)</h2>
      <button id="btn-ping">Enviar Ping</button>
      <p id="resposta">Aguardando...</p>

      <hr />
      <h2>Exercício 1 - Info da Máquina</h2>
      <button id="btn-hardware">Consultar Hardware</button>
      <p id="res-hardware">Clique para consultar.</p>

      <hr />
      <h2>Exercício 2 - Calculadora de IMC</h2>
      <input type="number" step="0.1" id="peso" placeholder="Peso (kg)" />
      <input type="number" step="0.01" id="altura" placeholder="Altura (m)" />
      <button id="btn-imc">Calcular IMC</button>
      <p id="res-imc">Preencha os dados e clique em calcular.</p>

      <hr />
      <h2>Exercício 3 - Gravador de Logs</h2>
      <input type="text" id="campo-log" placeholder="Escreva um log..." />
      <button id="btn-log">Salvar Log</button>
      <p id="res-log">O arquivo logs.txt será gerado na raiz da aplicação.</p>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>

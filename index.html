<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Fluxo de Caixa</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' ws://localhost:5173 http://localhost:5173;"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topo">
        <div class="topo-marca">
          <span class="topo-eyebrow">Livro-caixa digital</span>
          <h1>Gestor de Fluxo de Caixa</h1>
        </div>
        <button id="btn-ping" class="botao-fantasma">Testar conexão</button>
      </header>
      <p id="resposta" class="topo-resposta"></p>

      <!-- ===== Dados da máquina e log: não dependem de banco ===== -->
      <section class="secao">
        <h2>Diagnóstico local (sem banco de dados)</h2>
        <button id="btn-dados-maquina" class="botao-fantasma">
          Consultar hardware
        </button>
        <p id="resultado-dados-maquina" class="mensagem-status"></p>

        <form id="form-log" class="formulario-busca">
          <label for="texto-log">Registrar log em arquivo</label>
          <input
            type="text"
            id="texto-log"
            placeholder="Ex: app iniciado"
            autocomplete="off"
          />
          <button type="submit">Salvar log</button>
        </form>
        <p id="status-log" class="mensagem-status"></p>
      </section>

      <section class="secao-saldo">
        <div class="cartoes-saldo">
          <div class="cartao-stat cartao-stat--receita">
            <span class="cartao-stat-rotulo">Entrou</span>
            <span class="cartao-stat-valor" id="saldo-receitas">R$ 0,00</span>
          </div>
          <div class="cartao-stat cartao-stat--despesa">
            <span class="cartao-stat-rotulo">Saiu</span>
            <span class="cartao-stat-valor" id="saldo-despesas">R$ 0,00</span>
          </div>
        </div>

        <div class="carimbo" id="carimbo-saldo">
          <span class="carimbo-rotulo">Saldo apurado</span>
          <span class="carimbo-valor" id="saldo-total">R$ 0,00</span>
          <button id="btn-atualizar-saldo" class="carimbo-botao">
            Recalcular
          </button>
        </div>
      </section>

      <section class="secao">
        <h2>Formas de pagamento aceitas</h2>

        <form id="form-busca-pagamento" class="formulario-busca">
          <label for="busca-formas-pagamento">Buscar forma de pagamento</label>
          <input
            type="text"
            id="busca-formas-pagamento"
            name="busca-formas-pagamento"
            placeholder="Ex: pix"
            autocomplete="off"
          />
          <button type="submit">Buscar</button>
        </form>
        <p id="erro-busca-pagamento" class="mensagem-erro" role="alert"></p>
        <p id="status-busca-pagamento" class="mensagem-status"></p>

        <ul id="lista-formas-pagamento" class="chips"></ul>
      </section>

      <nav class="abas" id="nav-abas">
        <button type="button" class="aba-botao ativo" data-aba="categorias">
          Categorias
        </button>
        <button type="button" class="aba-botao" data-aba="transacoes">
          Transações
        </button>
        <button type="button" class="aba-botao" data-aba="filtros">
          Filtros
        </button>
      </nav>

      <div class="paineis-abas">
        <section class="cartao-painel aba-painel" data-aba-painel="categorias">
          <h2>Categorias</h2>
          <form id="form-categoria" class="formulario-compacto">
            <input type="hidden" id="categoria-id" value="" />
            <input
              type="text"
              id="categoria-nome"
              placeholder="Nome da categoria"
              required
            />
            <select id="categoria-tipo" required>
              <option value="">Tipo</option>
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
            </select>
            <div class="formulario-acoes">
              <button type="submit" id="btn-salvar-categoria">Salvar</button>
              <button
                type="button"
                id="btn-cancelar-categoria"
                class="botao-fantasma"
              >
                Cancelar
              </button>
            </div>
          </form>
          <p id="msg-categoria" class="mensagem-status"></p>
          <ul id="lista-categorias" class="lista-registro"></ul>
        </section>

        <section
          class="cartao-painel aba-painel"
          data-aba-painel="transacoes"
          hidden
        >
          <h2>Transações</h2>

          <div class="leitor-comprovante">
            <label for="input-comprovante-pix"
              >Ler comprovante Pix (imagem)</label
            >
            <input type="file" id="input-comprovante-pix" accept="image/*" />
            <p id="status-comprovante-pix" class="mensagem-status"></p>
          </div>

          <form id="form-transacao" class="formulario-compacto">
            <input type="hidden" id="transacao-id" value="" />
            <input
              type="text"
              id="transacao-descricao"
              placeholder="Descrição"
              required
            />
            <input
              type="number"
              step="0.01"
              id="transacao-valor"
              placeholder="Valor (R$)"
              required
            />
            <input type="date" id="transacao-data" required />
            <select id="transacao-categoria" required>
              <option value="">Categoria</option>
            </select>
            <select id="transacao-forma-pagamento">
              <option value="">Forma de pagamento (opcional)</option>
            </select>
            <div class="formulario-acoes">
              <button type="submit" id="btn-salvar-transacao">Salvar</button>
              <button
                type="button"
                id="btn-cancelar-transacao"
                class="botao-fantasma"
              >
                Cancelar
              </button>
            </div>
          </form>
          <p id="msg-transacao" class="mensagem-status"></p>

          <ul id="lista-transacoes" class="lista-registro"></ul>
        </section>

        <section
          class="cartao-painel aba-painel"
          data-aba-painel="filtros"
          hidden
        >
          <h2>Filtros de transações</h2>
          <div class="filtros-grade">
            <select id="filtro-tipo">
              <option value="">Todos os tipos</option>
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
            </select>
            <select id="filtro-categoria">
              <option value="">Todas as categorias</option>
            </select>
            <input type="date" id="filtro-data-inicio" />
            <input type="date" id="filtro-data-fim" />
            <div class="formulario-acoes">
              <button id="btn-filtrar">Filtrar</button>
              <button id="btn-limpar-filtro" class="botao-fantasma">
                Limpar
              </button>
            </div>
          </div>
          <p class="mensagem-status">
            O resultado do filtro aparece na aba Transações.
          </p>
        </section>
      </div>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>

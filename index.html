<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Fluxo de Caixa</title>
  </head>
  <body>
    <div id="app">
      <h1>Gestor de Fluxo de Caixa</h1>

      <h2>Ping IPC (boilerplate)</h2>
      <button id="btn-ping">Enviar Ping</button>
      <p id="resposta">Aguardando...</p>

      <hr />

      <h2>Formas de Pagamento</h2>
      <ul id="lista-formas-pagamento"></ul>

      <hr />

      <h2>Saldo Consolidado</h2>
      <button id="btn-atualizar-saldo">Atualizar Saldo</button>
      <p id="saldo-receitas">Receitas: R$ 0,00</p>
      <p id="saldo-despesas">Despesas: R$ 0,00</p>
      <p id="saldo-total"><strong>Saldo: R$ 0,00</strong></p>

      <hr />

      <h2>Categorias</h2>
      <form id="form-categoria">
        <input type="hidden" id="categoria-id" value="" />
        <input type="text" id="categoria-nome" placeholder="Nome da categoria" required />
        <select id="categoria-tipo" required>
          <option value="">Selecione o tipo</option>
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
        <button type="submit" id="btn-salvar-categoria">Salvar Categoria</button>
        <button type="button" id="btn-cancelar-categoria">Cancelar edição</button>
      </form>
      <p id="msg-categoria"></p>
      <ul id="lista-categorias"></ul>

      <hr />

      <h2>Transações</h2>
      <form id="form-transacao">
        <input type="hidden" id="transacao-id" value="" />
        <input type="text" id="transacao-descricao" placeholder="Descrição" required />
        <input type="number" step="0.01" id="transacao-valor" placeholder="Valor" required />
        <input type="date" id="transacao-data" required />
        <select id="transacao-categoria" required>
          <option value="">Selecione a categoria</option>
        </select>
        <button type="submit" id="btn-salvar-transacao">Salvar Transação</button>
        <button type="button" id="btn-cancelar-transacao">Cancelar edição</button>
      </form>
      <p id="msg-transacao"></p>

      <h3>Filtros</h3>
      <select id="filtro-tipo">
        <option value="">Todos os tipos</option>
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <select id="filtro-categoria">
        <option value="">Todas as categorias</option>
      </select>
      <input type="date" id="filtro-data-inicio" />
      <input type="date" id="filtro-data-fim" />
      <button id="btn-filtrar">Filtrar</button>
      <button id="btn-limpar-filtro">Limpar Filtros</button>

      <ul id="lista-transacoes"></ul>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
